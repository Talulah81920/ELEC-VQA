model_path: models/Qwen2.5-VL-7B-Instruct
train_data: dataset/training/train_evidence_answer.json
eval_data: dataset/training/validation_evidence_answer.json
image_root: dataset
output_dir: outputs/evidence_answer
quantization: none
require_bf16: true
seed: 42
min_pixels: 3136
max_pixels: 2097152
max_length: 8192
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
lora_targets:
- q_proj
- k_proj
- v_proj
- o_proj
learning_rate: 0.0001
epochs: 3
batch_size: 1
eval_batch_size: 1
gradient_accumulation_steps: 8
num_workers: 0
pin_memory: true
optim: adamw_torch_fused
logging_steps: 10
minimum_training_free_gib: 48
processor_use_fast: false
supervision_view: evidence_answer
response_format_instruction: Give concise visible evidence in English, then a brief
  answer.
dataset_name: ELEC-VQA
